<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 자동화 구상 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 공장 작업지시서처럼 차분하고 정확하게. 누가 무엇을 정하는지 늘 보이게.
   IDEA: 공정 라우팅 시트 — 여섯 공정 스테이션을 한 줄 라인이 잇는다.
   PICTURE: 상단의 공정 라인(선정→전환)과 회사 PC/외부 경계를 보여주는 데이터 흐름도.
   COLOUR and TYPE: 흰 바탕, 철강 잉크, AI=파랑, 사람 결정=앰버, 회사 PC=초록, 외부 전송=빨강. IBM Plex Sans KR.
   LAYOUT: 라인 아래 각 공정을 'AI가 하는 일 | 사람이 정하는 것' 두 열로. 600px 이하에서 한 열. */
:root{color-scheme:light;--bg:#ffffff;--panel:#f4f5f7;--ink:#14181c;--mute:#5b636c;--line:#d5d9de;--blue:#0a5cff;--green:#00874c;--red:#d71f18;--blueBg:#eaf1ff;--amberBg:#fff6dc;--greenBg:#e5f6ee;--redBg:#fdeceb;--huInk:#7a5400;--amber:#ffb400}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0e1116;--panel:#161a20;--ink:#eef0f2;--mute:#a3abb4;--line:#2c333c;--blue:#5c95ff;--green:#2fc37f;--red:#ff6b63;--blueBg:#14223d;--amberBg:#2e2610;--greenBg:#0f2a1e;--redBg:#33171a;--huInk:#ffc94d}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e1116;--panel:#161a20;--ink:#eef0f2;--mute:#a3abb4;--line:#2c333c;--blue:#5c95ff;--green:#2fc37f;--red:#ff6b63;--blueBg:#14223d;--amberBg:#2e2610;--greenBg:#0f2a1e;--redBg:#33171a;--huInk:#ffc94d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:hidden;overflow-x:clip}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,3.4vw,34px)}h2{font-size:22px;margin-bottom:6px}h3{font-size:17px;margin:0 0 6px}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px)}.wrap{max-width:1240px;margin:0 auto}
header.band{border-bottom:1px solid var(--line);padding-bottom:16px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.sub{color:var(--mute);margin:6px 0 0;max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:44px;width:100%}
textarea{min-height:84px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--amber);flex:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button{font:inherit;font-size:15px;font-weight:500;min-height:44px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}
.ai{background:var(--blue);border-color:var(--blue);color:#fff}
.hum{background:var(--amber);border-color:var(--amber);color:#14181c}
.ghost{border-color:transparent;background:none;color:var(--mute)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
label.ck{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;margin:8px 0}td label.ck{white-space:nowrap}
/* 공정 라인 */
.line{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-top:22px}
.line::before{content:"";position:absolute;left:8%;right:8%;top:21px;height:6px;border-radius:3px;background:var(--line)}
.line .prog{position:absolute;left:8%;top:21px;height:6px;border-radius:3px;background:var(--green);transition:width .4s}
.st{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0 2px 8px;min-height:0;text-align:center}
.st .dot{width:48px;height:48px;border-radius:50%;border:6px solid var(--line);background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}
.st.done .dot{border-color:var(--green)}.st.fixed{cursor:default}.st.fixed .dot{background:var(--green);border-color:var(--green);color:#fff}.st.fixed .dot svg{width:24px;height:24px}.st.on .dot{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.st b{font-size:15px}.st small{font-size:13px;color:var(--mute);line-height:1.3}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tabs2 a{color:var(--mute);text-decoration:none;font-size:14px;padding:10px 12px;border-radius:6px}.tabs2 a.on{color:var(--ink);background:var(--panel)}
/* 두 열 */
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;margin-top:16px}
.col{border-radius:10px;padding:18px;border:1px solid var(--line)}
.col.aiC{border-top:6px solid var(--blue)}.col.huC{border-top:6px solid var(--amber)}
.tag{display:inline-block;font-size:13px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-ai{background:var(--blueBg);color:var(--blue)}.t-hu{background:var(--amberBg);color:var(--huInk)}.t-pc{background:var(--greenBg);color:var(--green)}.t-ex{background:var(--redBg);color:var(--red)}
.card{background:var(--panel);border-radius:8px;padding:14px;margin:10px 0}
.note{font-size:14px;color:var(--mute)}
.draft{border-left:4px solid var(--blue);background:var(--blueBg);padding:10px 12px;border-radius:0 6px 6px 0;margin:8px 0;white-space:pre-wrap}
.draft::before{content:"AI 초안";display:block;font-size:13px;font-weight:700;color:var(--blue)}
.warn{color:var(--red);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}th{font-size:13px;color:var(--mute);font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}
.big{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
pre{white-space:pre-wrap;background:var(--panel);padding:12px;border-radius:6px;font-size:14px;max-height:340px;overflow:auto}
/* 데이터 흐름 */
.flow{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch;margin-top:14px}
.zone{border-radius:10px;padding:16px;border:2px solid}
.z-pc{border-color:var(--green);background:var(--greenBg)}.z-ai{border-color:var(--blue);background:var(--blueBg)}.z-gov{border-color:var(--ink);background:var(--panel)}
.zone ul{margin:6px 0 0;padding-left:18px;font-size:15px}
.gate{display:grid;place-items:center;font-size:13px;color:var(--red);font-weight:700;text-align:center;writing-mode:vertical-rl;border-left:3px dashed var(--red);padding:0 6px}
/* 모달 */
.modal{position:fixed;inset:0;background:rgb(0 0 0/.5);display:none;place-items:center;padding:16px;z-index:9}
.modal.open{display:grid}.box{background:var(--bg);border-radius:12px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px;border-top:6px solid var(--red)}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.phs figure{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.phs img{display:block;width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in}
.phs figcaption{padding:6px}.phs input{min-height:36px;padding:4px 6px;font-size:14px}.phs button{min-height:36px;padding:4px 8px;font-size:13px;width:100%;margin-top:4px}
.filebtn{display:flex;align-items:center;justify-content:center;min-height:44px;margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:15px;font-weight:500;cursor:pointer}.filebtn:hover{border-color:var(--ink)}.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.vh:focus-visible+*,.filebtn:focus-within{outline:3px solid var(--blue)}
.stagehead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}.stagehead h2{margin:0}.pn{display:flex;gap:8px}.pn button{min-width:96px}.pn .fin{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}.pn .nx:not(:disabled){background:var(--ink);border-color:var(--ink);color:var(--bg)}
.gotq{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:6px;background:var(--green);color:#fff;font-size:15px;font-weight:500}.gotq svg{width:18px;height:18px}
.pcbox{border:2px solid var(--green);background:var(--greenBg);border-radius:8px;padding:12px;margin-top:12px}
#pv .box{border-top-color:var(--green);max-width:1000px}#pv img{display:block;max-width:100%;max-height:72vh;margin:0 auto;border-radius:6px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
footer{color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}.flow{grid-template-columns:minmax(0,1fr)}.gate{writing-mode:horizontal-tb;border-left:0;border-top:3px dashed var(--red);padding:6px 0}}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.st small{display:none}.st .dot{width:38px;height:38px;border-width:5px;font-size:13px}.line::before,.line .prog{top:16px}.st b{font-size:13px}
table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="band"><div class="wrap">
  <div class="top">
    <div>
      <h1>AI 자동화 구상 도우미</h1>
    </div>
    <div class="row" style="min-width:260px;flex:0 1 360px">
      <label for="proj" style="margin:0;width:100%">현재 과제 (기업–학생 매칭)</label>
      <select id="proj"></select>
    </div>
  </div>
  <nav class="line" id="line" aria-label="공정 단계"></nav>
</div></header>

<main class="band"><div class="wrap" id="view"></div></main>

<footer class="band"><div class="wrap">
  <p><b>2단계(확대) 예정:</b> 국가 플랫폼으로 이전. 후보는 중기부 '제조AI 24', 산업부 클린룸·산단 엣지 AI 데이터센터. 서비스 시점과 이용 조건은 확인 필요.</p>
  <div class="row">
    <button id="exp">작업 파일 내보내기</button>
    <button id="impB">작업 파일 불러오기</button><input type="file" id="imp" accept="application/json" hidden>
    <button class="ghost" id="reset">예시로 초기화</button>
  </div>
  <p class="note">내보낸 작업 파일에는 원문과 수치가 들어 있으니 회사 PC 밖으로 옮기지 마세요. 제품 사진은 작업 파일에 포함되지 않고 이 브라우저에만 남습니다. 처음 열면 예시 데이터(가상의 기업·학생)가 들어 있습니다.</p>
</div></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mT"><div class="box">
  <h2 id="mT">외부 AI로 보낼 내용 확인</h2>
  <p class="note" id="mS"></p>
  <pre id="mP"></pre>
  <div class="row" style="justify-content:flex-end;margin-top:12px">
    <button id="mNo">취소</button><button class="ai" id="mOk">이 내용만 보내기</button>
  </div>
</div></div>
<div class="modal" id="pv" role="dialog" aria-modal="true" aria-label="사진 크게 보기"><div class="box"><img id="pvI" alt=""><div class="row" style="justify-content:space-between;margin-top:10px"><span id="pvC" class="note"></span><button id="pvX">닫기</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 {k:'select',n:'선정',d:'심사위원회 확정'},

 {k:'brief',n:'브리핑',d:'대표용 초안'},
 {k:'transition',n:'전환',d:'과정 기록'}];

const SIMV=[['hours','하루 해당 작업 시간','시간'],['people','투입 인원','명'],['wage','시간당 인건비','원'],['days','연 근무일','일'],['save','예상 절감률','%'],['capex','도입비','원'],['opex','연 유지비','원']];

 companies:[

  {id:'c3',name:'마바식품',ind:'떡·제과 제조',text:'포장 라인 인력이 부족함. AI가 무엇을 할 수 있는지 잘 모르겠음.'}],
 students:[
  {id:'s1',name:'김하늘',major:'기계공학',text:'비전 검사 AI로 외관 불량을 자동 판정하는 구상. 공개 데이터셋으로 모델을 연습해 본 경험이 있음.'},

  {id:'s3',name:'최서준',major:'경영학',text:'AI 도입 효과를 숫자로 따져 보는 일을 해 보고 싶음.'}],
 scores:{
  c1:{id:'c1',need:27,ready:22,will:18,spread:16,why:'고객 클레임으로 검사 자동화 필요성이 분명하고, 불량 샘플을 바로 모을 수 있음. 같은 업종 사출 업체로 확산 가능성도 높음.'},
  c2:{id:'c2',need:24,ready:12,will:16,spread:15,why:'설비 정지 문제는 크지만 센서가 없어 데이터 준비도가 낮음. 생산 계획 쪽은 엑셀 기록이 있어 출발점이 될 수 있음.'},

  s3:{id:'s3',bonus:2,why:'효과 분석 관심은 좋으나 AI 전환 구상은 아직 일반적임.'}},

 committee:{c1:true,c2:true,s1:true,s2:true},
 projects:[{id:'p1',company:'c1',student:'s1',mentor:'박숙련 반장',
  tasks:[
   T('t1','사출품 불량 판정','',{photo:true,

function mask(text){
  let t=String(text??''),hits=0;
  const rep=(re,to)=>{t=t.replace(re,()=>{hits++;return to})};
  const lit=s=>new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
  for(const w of terms('customer'))rep(lit(w),'[고객사]');
  for(const w of terms('company'))rep(lit(w),'[기업]');
  for(const w of terms('person'))rep(lit(w),'[인물]');
  for(const w of terms('other'))rep(lit(w),'[비공개]');
  rep(/[\w.+-]+@[\w-]+\.[\w.]+/g,'[이메일]');
  rep(/\d{2,4}-\d{3,4}-\d{4}/g,'[전화]');
  rep(/\d[\d,.]*\s*(만\s*원|억\s*원|천\s*원|원|억|만|%|퍼센트|개|ea|EA|시간|분|초|명|kg|g|mm|㎜|cm|℃|도|톤|대|회|건|일|주|개월|년)?/g,'[수치]');
  return{t,hits};
}
function maskObj(o){let hits=0;const w=v=>{if(typeof v==='string'){const m=mask(v);hits+=m.hits;return m.t}if(typeof v==='number'){hits++;return'[수치]'}if(Array.isArray(v))return v.map(w);if(v&&typeof v==='object'){const r={};for(const k in v)r[k]=w(v[k]);return r}return v};return{o:w(o),hits}}

function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('aiPlatPhotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function tx(mode,fn){return new Promise((res,rej)=>{if(!phDB)return res(null);try{const t=phDB.transaction('p',mode),r=fn(t.objectStore('p'));t.oncomplete=()=>res(r?.result);t.onerror=()=>rej(t.error)}catch(e){rej(e)}})}
(async()=>{await null;try{phDB=await openDB();const rows=await tx('readonly',st=>st.getAll());PH=(rows||[]).map(r=>({...r,url:URL.createObjectURL(r.blob)}))}catch(e){phDB=null;phMem=true}await delPhotos(r=>r.id==='demo-conveyor');await seedDemo();render()})();
/* 시연용 예시 그림: 처음 한 번만 외관 검사(t1)에 넣음. 실제 사진이 아니라 그린 그림 */
const DEMO=[['good','양품 (예시 그림)'],['speck','흑점 (예시 그림)'],['scratch','긁힘 (예시 그림)'],['short','미성형 (예시 그림)']];
async function seedDemo(force){
  let done=false;try{done=localStorage.getItem('aiPlat.demoPh')==='1'}catch(e){}
  if(done&&!force)return;const p=S.projects.find(x=>x.id==='p1');if(!p||!p.tasks.some(t=>t.id==='t1'))return;
  if(PH.some(r=>r.proj==='p1'&&r.task==='t1'))return;
  for(const[f,label]of DEMO){try{const res=await fetch('demo/'+f+'.jpg');if(!res.ok)continue;const blob=await res.blob();
    const r={id:'demo-'+f,proj:'p1',task:'t1',label,date:'2026-11-17',blob};try{await tx('readwrite',st=>st.put(r))}catch(e){}
    PH.push({...r,url:URL.createObjectURL(blob)})}catch(e){}}
  if(PH.some(r=>r.id.startsWith('demo-'))&&!phMem){try{localStorage.setItem('aiPlat.demoPh','1')}catch(e){}}
}
function loadImg(file){ // createImageBitmap이 없거나 실패하는 브라우저(구형 사파리 등) 대비
  if(window.createImageBitmap)return createImageBitmap(file).catch(()=>viaImg(file));return viaImg(file)}
function viaImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function shrink(file){ // 1600px 이하 JPEG로 다시 그림: 용량을 줄이고 위치(GPS) 등 사진 정보도 지워짐
  const bmp=await loadImg(file),k=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close?.();
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(),'image/jpeg',.85))}
async function addPhotos(task,files,label){
  let n=0;for(const f of files){try{const blob=await shrink(f);const r={id:uid(),proj:S.cur,task,label:label||'미분류',date:today(),blob};
    try{await tx('readwrite',st=>st.put(r))}catch(e){phMem=true}
    PH.push({...r,url:URL.createObjectURL(blob)});n++}catch(e){toast(`${f.name}: 열 수 없는 형식입니다 (JPG·PNG 권장)`)}}
  if(n)toast(`사진 ${n}장을 이 브라우저에 저장했습니다`);render()}
async function delPhotos(pred){for(const r of PH.filter(pred)){URL.revokeObjectURL(r.url);try{await tx('readwrite',st=>st.delete(r.id))}catch(e){}}PH=PH.filter(r=>!pred(r))}
const photosOf=(t)=>PH.filter(r=>r.task===t&&r.proj===S.cur);

    const r=await ai('과정 기록 정리',`진행 기록을 단계별 과정 기록(무엇을 했고, 무엇을 배웠고, 다음에 할 일)으로 5–8줄 정리. 형식: {"summary":""}`,{결론:p.tasks.map(t=>({작업:t.name,결론:t.conc})),기록:p.trans.logs},b);
    if(r)upd(p=>p.trans.summary=r.summary||'');return}
  if(id==='cpG'){try{await navigator.clipboard.writeText(JSON.stringify(govRecord(p),null,1));toast('복사했습니다')}catch(e){toast('복사하지 못했습니다')}return}
  if(id==='dlG'){saveFile('과정기록_비식별.json',JSON.stringify(govRecord(p),null,1));return}
});
async function saveFile(name,data){let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
  if(!dl){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('저장했습니다')}catch(e){try{await navigator.clipboard.writeText(data);toast('파일 저장을 쓸 수 없어 클립보드로 복사했습니다')}catch(x){toast('저장하지 못했습니다')}}return}
  try{await dl.save({filename:name,data});toast('저장했습니다')}catch(e){toast('저장이 취소되었습니다')}}
$('#exp').onclick=()=>saveFile('AI도우미_작업파일_'+today()+'.json',JSON.stringify(S));
$('#impB').onclick=()=>$('#imp').click();
$('#imp').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(!o.projects)throw 0;S=o;save();render();toast('불러왔습니다')}catch(x){toast('작업 파일이 아닙니다')}};
let rs=0;$('#reset').onclick=e=>{if(!rs){rs=1;e.target.textContent='한 번 더 누르면 모든 작업이 지워집니다';setTimeout(()=>{rs=0;e.target.textContent='예시로 초기화'},4000);return}delPhotos(()=>true).then(()=>seedDemo(true)).then(render);S=sample();save();rs=0;e.target.textContent='예시로 초기화';render()};
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').classList.contains('open'))$('#mNo').click();$('#pv').classList.remove('open')}});
$('#pvX').onclick=()=>$('#pv').classList.remove('open');$('#pv').onclick=e=>{if(e.target.id==='pv')$('#pv').classList.remove('open')};
render();
}
